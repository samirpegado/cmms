# Coolify resource for the API, Postgres and MinIO only.
# The web UI is a second resource: docker-compose.frontend.yml.
# Do not enable Raw Compose. Coolify injects proxy labels from SERVICE_URL_*.
# Domains: api → :8080, minio → :9000. Postgres and the MinIO console stay internal.

name: atlas-cmms
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    # minio/minio was removed from Docker Hub. Chainguard ships the same server.
    # Root so the data volume is writable.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    restart: unless-stopped
    environment:
      - SERVICE_URL_MINIO_9000
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MINIO}
      - MINIO_SERVER_URL=https://files.ativhub.sgapps.org
    volumes:
      - minio_data:/data
    command: server --address ":9000" --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    # This database was migrated by the official image. The API source in this
    # repo is an older model (custom_field.name) and fails schema validation.
    image: intelloop/atlas-cmms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./logo:/app/static/images
      - ./config:/app/static/config
    environment:
      - SERVICE_URL_API_8080
      - DB_URL=postgres/atlas
      - DB_USER=${SERVICE_USER_POSTGRES}
      - DB_PWD=${SERVICE_PASSWORD_64_POSTGRES}
      - PUBLIC_API_URL=https://api.ativhub.sgapps.org
      - PUBLIC_FRONT_URL=https://ativhub.sgapps.org
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-}
      - GCP_JSON=${GCP_JSON:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - MAIL_RECIPIENTS=${MAIL_RECIPIENTS:-}
      - SMTP_PWD=${SMTP_PWD:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      - JWT_SECRET_KEY=${SERVICE_REALBASE64_64_JWT}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=atlas-bucket
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_64_MINIO}
      - STORAGE_TYPE=${STORAGE_TYPE:-minio}
      - PUBLIC_MINIO_ENDPOINT=https://files.ativhub.sgapps.org
      - INVITATION_VIA_EMAIL=${INVITATION_VIA_EMAIL:-false}
      - ENABLE_EMAIL_NOTIFICATIONS=${ENABLE_EMAIL_NOTIFICATIONS:-false}
      - ENABLE_SSO=${ENABLE_SSO:-false}
      - OAUTH2_PROVIDER=${OAUTH2_PROVIDER:-}
      - OAUTH2_CLIENT_ID=${OAUTH2_CLIENT_ID:-}
      - OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET:-}
      - LICENSE_KEY=${LICENSE_KEY:-}
      - LICENSE_FINGERPRINT_REQUIRED=${LICENSE_FINGERPRINT_REQUIRED:-false}
      - LICENSE_FILE_PATH=${LICENSE_FILE_PATH:-}
      - ALLOWED_ORGANIZATION_ADMINS=${ALLOWED_ORGANIZATION_ADMINS:-}
      - LOGO_PATHS=${LOGO_PATHS:-}
      - CUSTOM_COLORS=${CUSTOM_COLORS:-}
      - BRAND_CONFIG=${BRAND_CONFIG:-}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_WEBHOOK_SECRET_KEY=${PADDLE_WEBHOOK_SECRET_KEY:-}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - ENABLE_CORS=${ENABLE_CORS:-true}
      - KEYGEN_PRODUCT_TOKEN=${KEYGEN_PRODUCT_TOKEN:-}
      - MAIL_TYPE=${MAIL_TYPE:-smtp}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_CONTACT_LIST_ID=${SENDGRID_CONTACT_LIST_ID:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health-check"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  postgres_data:
  minio_data:
