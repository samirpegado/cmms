# Coolify resource for the web UI only.
# Build pack Docker Compose. Do not enable Raw Compose.
# Base directory /, Compose file /docker-compose.frontend.yml
# Domain: https://ativhub.sgapps.org:3000
# Watch Paths: frontend/** and docker-compose.frontend.yml
# A commit that only changes the UI restarts this resource and leaves the API running.
# The files in frontend/prebuilt are already compiled. Coolify does not run the React build.

name: ativhub-frontend
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    image: ativhub-frontend
    restart: unless-stopped
    environment:
      - SERVICE_URL_FRONTEND_3000
      - API_URL=https://api.ativhub.sgapps.org
      - HOME_URL=https://atlas-cmms.com
      - "GOOGLE_KEY= "
      - "GOOGLE_TRACKING_ID= "
      - INVITATION_VIA_EMAIL=false
      - CLOUD_VERSION=false
      - NODE_ENV=production
      - ENABLE_SSO=false
      - "OAUTH2_PROVIDER= "
      - LOGO_PATHS=null
      - CUSTOM_COLORS=null
      - BRAND_CONFIG=null
      - "DEMO_LINK= "
      - "PADDLE_SECRET_TOKEN= "
      - PADDLE_ENVIRONMENT=sandbox
      - "RECAPTCHA_SITE_KEY= "
      - LDAP_ENABLED=false
      - "CLARITY_ID= "
      - "SENTRY_DSN= "
      - SENTRY_ENVIRONMENT=production
      - "SENTRY_RELEASE= "
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
